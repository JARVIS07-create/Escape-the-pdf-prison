<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign In | FolioPulse</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #0b0f19;
            color: white;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
            overflow: hidden;
        }

        /* Shared Office Graphic Background */
        .office-bg {
            position: fixed;
            inset: 0;
            z-index: 0;
            background: 
                linear-gradient(to bottom, rgba(11, 15, 25, 0.8), rgba(11, 15, 25, 0.95)),
                url('https://images.unsplash.com/photo-1497366216548-37526070297c?auto=format&fit=crop&w=1920&q=80') center/cover no-repeat;
            pointer-events: none;
        }

        .auth-container {
            position: relative;
            z-index: 10;
            width: 100%;
            max-width: 420px;
            padding: 20px;
        }

        .auth-card {
            background: rgba(15, 23, 42, 0.85);
            padding: 40px;
            border-radius: 20px;
            border: 1px solid rgba(255, 255, 255, 0.12);
            box-shadow: 0 25px 50px rgba(0, 0, 0, 0.5);
            backdrop-filter: blur(16px);
        }

        .logo { text-align: center; font-size: 26px; font-weight: bold; margin-bottom: 12px; }
        h2 { text-align: center; margin-bottom: 8px; font-size: 22px; }
        .subtitle { text-align: center; color: #94a3b8; margin-bottom: 28px; font-size: 14px; }
        
        .form-group { margin-bottom: 18px; }
        label { display: block; margin-bottom: 7px; font-size: 13px; color: #cbd5e1; }
        
        input {
            width: 100%;
            padding: 13px;
            border-radius: 8px;
            border: 1px solid #334155;
            background: rgba(30, 41, 59, 0.7);
            color: white;
            font-size: 14px;
            outline: none;
            transition: border-color 0.2s;
        }

        input:focus { border-color: #38bdf8; }

        .forgot-link {
            display: block;
            text-align: right;
            margin-top: 8px;
            color: #38bdf8;
            text-decoration: none;
            font-size: 13px;
        }

        .forgot-link:hover { text-decoration: underline; }

        .submit-btn {
            width: 100%;
            padding: 13px;
            margin-top: 15px;
            border: none;
            border-radius: 8px;
            background: #3b82f6;
            color: white;
            font-size: 15px;
            font-weight: bold;
            cursor: pointer;
            transition: background 0.2s;
        }

        .submit-btn:hover { background: #2563eb; }

        .switch-text { text-align: center; margin-top: 22px; color: #94a3b8; font-size: 14px; }
        .switch-text a { color: #38bdf8; text-decoration: none; font-weight: 600; }
        .back-home { display: block; text-align: center; margin-top: 18px; color: #64748b; font-size: 13px; text-decoration: none; }
        .back-home:hover { color: #94a3b8; }
    </style>
</head>
<body>

    <div class="office-bg"></div>

    <div class="auth-container">
        <div class="auth-card">
            <div class="logo">⚡ FolioPulse</div>
            <h2>Welcome Back</h2>
            <p class="subtitle">Sign in to continue to your dashboard.</p>

            <form onsubmit="handleSignIn(event)">
                <div class="form-group">
                    <label for="email">Email Address</label>
                    <input type="email" id="email" placeholder="Enter your email" required>
                </div>

                <div class="form-group">
                    <label for="password">Password</label>
                    <input type="password" id="password" placeholder="Enter your password" required>
                    <a href="forgot-password.html" class="forgot-link">Forgot Password?</a>
                </div>

                <button type="submit" class="submit-btn">Sign In</button>
            </form>

            <p class="switch-text">
                Don't have an account? <a href="signup.html">Create Account</a>
            </p>

            <a href="index.html" class="back-home">← Back to Home</a>
        </div>
    </div>

    <script>
        function handleSignIn(event) {
            event.preventDefault();
            // Redirects straight to the Dashboard view upon login
            window.location.href = "dashboard.html";
        }
    </script>
</body>
</html>
