<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Chat Assistant - FolioPulse</title>
    <link rel="stylesheet" href="style.css">
    <style>
        .chat-wrapper {
            background: rgba(255, 255, 255, 0.92);
            border: 1px solid rgba(226, 232, 240, 0.9);
            border-radius: 16px;
            padding: 24px;
            max-width: 800px;
            height: 78vh;
            margin: 0 auto;
            display: flex;
            flex-direction: column;
            backdrop-filter: blur(12px);
            box-shadow: 0 20px 40px -15px rgba(15, 23, 42, 0.08);
        }

        .chat-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding-bottom: 16px;
            border-bottom: 1px solid #e2e8f0;
        }

        .chat-header h2 {
            font-size: 18px;
            color: #0f172a;
            display: flex;
            align-items: center;
            gap: 8px;
            margin: 0;
        }

        .chat-header-actions {
            display: flex;
            gap: 8px;
            align-items: center;
        }

        .api-key-btn {
            font-size: 12px;
            padding: 7px 12px;
            background: #2563eb;
            color: white;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-weight: 600;
            transition: all 0.2s ease;
        }

        .api-key-btn:hover {
            background: #1d4ed8;
        }

        .clear-chat-btn {
            font-size: 12px;
            padding: 6px 10px;
            background: transparent;
            border: 1px solid #e2e8f0;
            border-radius: 6px;
            cursor: pointer;
            color: #64748b;
            transition: all 0.2s ease;
        }

        .clear-chat-btn:hover {
            background: #fee2e2;
            color: #dc2626;
            border-color: #fca5a5;
        }

        .chat-messages {
            flex: 1;
            overflow-y: auto;
            padding: 20px 0;
            display: flex;
            flex-direction: column;
            gap: 14px;
        }

        .message {
            max-width: 80%;
            padding: 12px 16px;
            border-radius: 12px;
            font-size: 14px;
            line-height: 1.6;
            word-wrap: break-word;
        }

        .message.user {
            align-self: flex-end;
            background-color: #2563eb;
            color: #ffffff;
            border-bottom-right-radius: 2px;
            white-space: pre-wrap;
        }

        .message.assistant {
            align-self: flex-start;
            background-color: #f8fafc;
            color: #1e293b;
            border-bottom-left-radius: 2px;
            border: 1px solid #e2e8f0;
        }

        .message.assistant p {
            margin: 0 0 8px 0;
        }

        .message.assistant p:last-child {
            margin-bottom: 0;
        }

        .message.assistant ul, .message.assistant ol {
            margin: 4px 0 8px 20px;
            padding: 0;
        }

        .message.assistant li {
            margin-bottom: 4px;
        }

        .message.assistant strong {
            color: #0f172a;
        }

        .message.assistant code {
            background: #e2e8f0;
            padding: 2px 6px;
            border-radius: 4px;
            font-family: monospace;
            font-size: 13px;
        }

        .message.assistant pre {
            background: #1e293b;
            color: #f8fafc;
            padding: 10px;
            border-radius: 6px;
            overflow-x: auto;
            margin: 8px 0;
        }

        .message.assistant pre code {
            background: transparent;
            color: inherit;
            padding: 0;
        }

        .message.error {
            background-color: #fef2f2;
            color: #b91c1c;
            border-color: #fecaca;
        }

        .message.loading {
            font-style: italic;
            color: #64748b;
        }

        .chat-input-area {
            display: flex;
            gap: 10px;
            padding-top: 16px;
            border-top: 1px solid #e2e8f0;
        }

        .chat-input-area input {
            flex: 1;
            padding: 12px 16px;
            border: 1px solid #cbd5e1;
            border-radius: 8px;
            font-size: 14px;
            outline: none;
            transition: border-color 0.2s;
        }

        .chat-input-area input:focus {
            border-color: #2563eb;
        }

        .chat-input-area button {
            padding: 12px 22px;
            background: #2563eb;
            color: white;
            border: none;
            border-radius: 8px;
            font-weight: 600;
            cursor: pointer;
            transition: background-color 0.2s;
        }

        .chat-input-area button:hover:not(:disabled) {
            background: #1d4ed8;
        }

        .chat-input-area button:disabled {
            background: #94a3b8;
            cursor: not-allowed;
        }
    </style>
</head>
<body>

    <div class="overlay"></div>

    <!-- NAVBAR -->
    <header class="navbar">
        <a href="index.html" class="logo">
            <span class="logo-badge">⚡</span> FolioPulse
        </a>

        <div class="nav-right">
            <div class="dropdown" id="user-dropdown">
                <button class="dropdown-btn" type="button" onclick="toggleDropdown(event)">
                    <div class="avatar" id="nav-user-avatar">👤</div>
                    <span id="nav-user-name">Menu</span>
                    <span class="chevron">▼</span>
                </button>
                <div class="dropdown-menu">
                    <a href="profile.html" class="dropdown-item">👤 Profile Settings</a>
                    <a href="portfolio.html" class="dropdown-item">📁 My Portfolios</a>
                    <a href="chat.html" class="dropdown-item">🤖 AI Chat Box</a>
                    <div class="dropdown-divider"></div>
                    <a href="index.html" class="dropdown-item logout-link" onclick="handleLogout(event)">🚪 Sign Out</a>
                </div>
            </div>
        </div>
    </header>

    <!-- MAIN CHAT CONTAINER -->
    <main class="container">
        <div class="chat-wrapper">
            <div class="chat-header">
                <h2>🤖 FolioPulse AI Assistant</h2>
                <div class="chat-header-actions">
                    <button class="clear-chat-btn" onclick="clearChat()" title="Clear Chat History">🗑️ Clear</button>
                    <button class="api-key-btn" onclick="promptApiKey()">🔑 Gemini API Key</button>
                </div>
            </div>

            <div class="chat-messages" id="chat-messages">
                <div class="message assistant">
                    Hello! I'm your FolioPulse AI assistant. Ask me to help optimize your resume summary, generate portfolio project descriptions, or prepare interview answers based on your experience!
                </div>
            </div>

            <form class="chat-input-area" onsubmit="sendMessage(event)">
                <input type="text" id="user-input" placeholder="Ask anything about your portfolio, resume, or projects..." autocomplete="off">
                <button type="submit" id="send-btn">Send</button>
            </form>
        </div>
    </main>

    <script>
        const chatMessages = document.getElementById("chat-messages");
        const userInput = document.getElementById("user-input");
        const sendBtn = document.getElementById("send-btn");

        let conversationHistory = [];

        window.addEventListener("DOMContentLoaded", () => {
            syncNavbarProfile();
            const key = localStorage.getItem("geminiApiKey");
            if (!key) {
                setTimeout(promptApiKey, 500);
            }
        });

        function toggleDropdown(event) {
            event.stopPropagation();
            document.getElementById("user-dropdown").classList.toggle("open");
        }

        document.addEventListener('click', (e) => {
            const dropdown = document.getElementById("user-dropdown");
            if (dropdown && !dropdown.contains(e.target)) {
                dropdown.classList.remove("open");
            }
        });

        function syncNavbarProfile() {
            let savedProfile = null;
            try {
                savedProfile = JSON.parse(localStorage.getItem("userProfile"));
            } catch (e) {
                savedProfile = null;
            }

            const navAvatar = document.getElementById("nav-user-avatar");
            const navName = document.getElementById("nav-user-name");

            if (savedProfile) {
                if (navName && savedProfile.firstName) {
                    navName.textContent = savedProfile.firstName;
                }
                if (navAvatar) {
                    if (savedProfile.avatar) {
                        navAvatar.style.backgroundImage = `url('${savedProfile.avatar}')`;
                        navAvatar.style.backgroundSize = "cover";
                        navAvatar.textContent = "";
                    } else {
                        const initials = ((savedProfile.firstName?.[0] || '') + (savedProfile.lastName?.[0] || '')).toUpperCase() || '👤';
                        navAvatar.textContent = initials;
                    }
                }
            }
        }

        function cleanToken(rawKey) {
            if (!rawKey) return "";
            return rawKey.trim().replace(/^["']|["']$/g, '');
        }

        function promptApiKey() {
            const currentKey = localStorage.getItem("geminiApiKey") || "";
            const key = prompt(
                "Paste your Google Gemini API Key below:",
                currentKey
            );

            if (key !== null) {
                const cleaned = cleanToken(key);
                if (cleaned !== "") {
                    localStorage.setItem("geminiApiKey", cleaned);
                    alert("✓ Gemini API Key saved successfully!");
                } else {
                    localStorage.removeItem("geminiApiKey");
                }
            }
        }

        function clearChat() {
            if (confirm("Are you sure you want to clear this conversation?")) {
                conversationHistory = [];
                chatMessages.innerHTML = `
                    <div class="message assistant">
                        Conversation cleared. How can I help you with your portfolio today?
                    </div>
                `;
            }
        }

        function formatMarkdown(text) {
            if (!text) return "";
            let html = text
                .replace(/&/g, "&amp;")
                .replace(/</g, "&lt;")
                .replace(/>/g, "&gt;")
                .replace(/```([\s\S]*?)```/g, '<pre><code>$1</code></pre>')
                .replace(/`([^`]+)`/g, '<code>$1</code>')
                .replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>')
                .replace(/\*([^*]+)\*/g, '<em>$1</em>')
                .replace(/^\s*[-*]\s+(.*)$/gm, '<li>$1</li>')
                .replace(/\n\n+/g, '</p><p>')
                .replace(/\n/g, '<br>');

            html = html.replace(/(<li>.*<\/li>)/gs, '<ul>$1</ul>');
            return `<p>${html}</p>`;
        }

        function appendMessage(content, role, isHTML = false) {
            const msg = document.createElement("div");
            msg.className = `message ${role}`;
            if (isHTML) {
                msg.innerHTML = content;
            } else {
                msg.textContent = content;
            }
            chatMessages.appendChild(msg);
            chatMessages.scrollTop = chatMessages.scrollHeight;
            return msg;
        }

        // Executes API request using Gemini 2.0 Flash and newer models first
        async function executeGeminiRequest(key, contents) {
            const cleanKey = cleanToken(key);
            
            // Priority list: gemini-2.0-flash is the primary model for new Google AI Studio projects
            const models = [
                "gemini-2.0-flash",
                "gemini-2.0-flash-lite",
                "gemini-1.5-flash",
                "gemini-1.5-flash-latest",
                "gemini-2.5-flash",
                "gemini-1.5-pro",
                "gemini-pro"
            ];

            let lastError = null;

            for (const model of models) {
                try {
                    const endpoint = `https://generativelanguage.googleapis.com/v1beta/models/${model}:generateContent?key=${encodeURIComponent(cleanKey)}`;
                    
                    const response = await fetch(endpoint, {
                        method: "POST",
                        headers: {
                            "Content-Type": "application/json",
                            "x-goog-api-key": cleanKey
                        },
                        body: JSON.stringify({
                            contents: contents,
                            generationConfig: {
                                temperature: 0.7,
                                maxOutputTokens: 1000
                            }
                        })
                    });

                    const data = await response.json();

                    if (response.ok && data.candidates && data.candidates.length > 0) {
                        return data;
                    }

                    if (data.error) {
                        const errMsg = data.error.message || "";
                        if (data.error.code === 404 || errMsg.includes("not found") || errMsg.includes("not supported")) {
                            lastError = new Error(errMsg);
                            continue; // Try next model in list
                        } else {
                            throw new Error(errMsg);
                        }
                    }
                } catch (e) {
                    lastError = e;
                    if (e.message && !e.message.includes("not found") && !e.message.includes("not supported")) {
                        throw e;
                    }
                }
            }

            throw lastError || new Error("Unable to connect. Please check your Gemini API key.");
        }

        async function sendMessage(event) {
            event.preventDefault();
            const text = userInput.value.trim();
            const rawKey = localStorage.getItem("geminiApiKey");

            if (!text) return;

            if (!rawKey) {
                alert("Please add your Gemini API Key first.");
                promptApiKey();
                return;
            }

            const key = cleanToken(rawKey);

            appendMessage(text, "user");
            userInput.value = "";
            sendBtn.disabled = true;

            const loadingMsg = appendMessage("Thinking...", "assistant loading");

            try {
                let userProfile = {};
                let portfolioData = {};
                try {
                    userProfile = JSON.parse(localStorage.getItem("userProfile") || "{}");
                    portfolioData = JSON.parse(localStorage.getItem("portfolioData") || "{}");
                } catch(e) {}

                const contextInfo = JSON.stringify({
                    profile: userProfile,
                    resume_portfolio: portfolioData
                });

                const systemInstruction = `You are FolioPulse AI, an expert career advisor and portfolio builder assistant. Current User Profile & Portfolio Data: ${contextInfo}. Provide concise, actionable advice for portfolio improvement, tech skills, resume phrasing, and interview prep.`;

                conversationHistory.push({
                    role: "user",
                    parts: [{ text: text }]
                });

                const recentHistory = conversationHistory.slice(-8);
                const formattedContents = recentHistory.map((m, idx) => {
                    if (idx === 0 && m.role === "user") {
                        return {
                            role: "user",
                            parts: [{ text: `${systemInstruction}\n\nUser Question: ${m.parts[0].text}` }]
                        };
                    }
                    return {
                        role: m.role === "model" ? "model" : "user",
                        parts: m.parts
                    };
                });

                const data = await executeGeminiRequest(key, formattedContents);
                const replyText = data.candidates?.[0]?.content?.parts?.[0]?.text;

                if (replyText) {
                    loadingMsg.className = "message assistant";
                    loadingMsg.innerHTML = formatMarkdown(replyText);

                    conversationHistory.push({
                        role: "model",
                        parts: [{ text: replyText }]
                    });
                } else {
                    throw new Error("Received an empty response from Gemini.");
                }
            } catch (err) {
                console.error("Chat Error:", err);
                loadingMsg.className = "message assistant error";
                loadingMsg.innerHTML = `<strong>⚠️ Error:</strong> ${err.message}<br><small style="margin-top:6px;display:block;">Click <strong>"🔑 Gemini API Key"</strong> in the top right to verify your key.</small>`;
            } finally {
                sendBtn.disabled = false;
                userInput.focus();
                chatMessages.scrollTop = chatMessages.scrollHeight;
            }
        }

        function handleLogout(event) {
            event.preventDefault();
            localStorage.removeItem("isLoggedIn");
            localStorage.removeItem("userProfile");
            localStorage.removeItem("portfolioData");
            window.location.href = "index.html";
        }
    </script>
</body>
</html>
