<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Chat Assistant - FolioPulse</title>
    <link rel="stylesheet" href="style.css">
    <style>
        .chat-wrapper {
            background: rgba(255, 255, 255, 0.92);
            border: 1px solid rgba(226, 232, 240, 0.9);
            border-radius: 16px;
            padding: 24px;
            max-width: 800px;
            height: 78vh;
            margin: 0 auto;
            display: flex;
            flex-direction: column;
            backdrop-filter: blur(12px);
            box-shadow: 0 20px 40px -15px rgba(15, 23, 42, 0.08);
        }

        .chat-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding-bottom: 16px;
            border-bottom: 1px solid #e2e8f0;
        }

        .chat-header h2 {
            font-size: 18px;
            color: #0f172a;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .api-key-btn {
            font-size: 12px;
            padding: 6px 12px;
            background: #f1f5f9;
            border: 1px solid #cbd5e1;
            border-radius: 6px;
            cursor: pointer;
            font-weight: 600;
            transition: all 0.2s ease;
        }

        .api-key-btn:hover {
            background: #e2e8f0;
        }

        .chat-messages {
            flex: 1;
            overflow-y: auto;
            padding: 20px 0;
            display: flex;
            flex-direction: column;
            gap: 14px;
        }

        .message {
            max-width: 75%;
            padding: 12px 16px;
            border-radius: 12px;
            font-size: 14px;
            line-height: 1.5;
            word-wrap: break-word;
            white-space: pre-wrap;
        }

        .message.user {
            align-self: flex-end;
            background-color: #2563eb;
            color: #ffffff;
            border-bottom-right-radius: 2px;
        }

        .message.assistant {
            align-self: flex-start;
            background-color: #f1f5f9;
            color: #1e293b;
            border-bottom-left-radius: 2px;
            border: 1px solid #e2e8f0;
        }

        .chat-input-area {
            display: flex;
            gap: 10px;
            padding-top: 16px;
            border-top: 1px solid #e2e8f0;
        }

        .chat-input-area input {
            flex: 1;
            padding: 12px 16px;
            border: 1px solid #cbd5e1;
            border-radius: 8px;
            font-size: 14px;
            outline: none;
        }

        .chat-input-area input:focus {
            border-color: #2563eb;
        }

        .chat-input-area button {
            padding: 12px 20px;
            background: #2563eb;
            color: white;
            border: none;
            border-radius: 8px;
            font-weight: 600;
            cursor: pointer;
        }

        .chat-input-area button:disabled {
            background: #94a3b8;
            cursor: not-allowed;
        }
    </style>
</head>
<body>

    <div class="overlay"></div>

    <header class="navbar">
        <a href="index.html" class="logo">
            <span class="logo-badge">⚡</span> FolioPulse
        </a>

        <div class="nav-right">
            <div class="dropdown" id="user-dropdown">
                <button class="dropdown-btn" type="button" onclick="toggleDropdown(event)">
                    <div class="avatar" id="nav-user-avatar">AM</div>
                    <span id="nav-user-name">Profile</span>
                    <span class="chevron">▼</span>
                </button>
                <div class="dropdown-menu">
                    <a href="profile.html" class="dropdown-item">👤 Profile Settings</a>
                    <a href="portfolio.html" class="dropdown-item">📁 My Portfolios</a>
                    <a href="chat.html" class="dropdown-item">🤖 AI Chat Box</a>
                    <div class="dropdown-divider"></div>
                    <a href="index.html" class="dropdown-item logout-link" onclick="handleLogout(event)">🚪 Sign Out</a>
                </div>
            </div>
        </div>
    </header>

    <main class="container">
        <div class="chat-wrapper">
            <div class="chat-header">
                <h2>🤖 FolioPulse AI Assistant</h2>
                <button class="api-key-btn" onclick="promptApiKey()">⚙️ Set Gemini API Key</button>
            </div>

            <div class="chat-messages" id="chat-messages">
                <div class="message assistant">Hello! I'm your FolioPulse assistant. Ask me to help optimize your resume, write project descriptions, or structure your portfolio.</div>
            </div>

            <form class="chat-input-area" onsubmit="sendMessage(event)">
                <input type="text" id="user-input" placeholder="Type your prompt here..." autocomplete="off">
                <button type="submit" id="send-btn">Send</button>
            </form>
        </div>
    </main>

    <script>
        const chatMessages = document.getElementById("chat-messages");
        const userInput = document.getElementById("user-input");
        const sendBtn = document.getElementById("send-btn");

        window.addEventListener("DOMContentLoaded", () => {
            syncNavbarProfile();
            if (!localStorage.getItem("geminiApiKey")) {
                setTimeout(promptApiKey, 500);
            }
        });

        function toggleDropdown(event) {
            event.stopPropagation();
            document.getElementById("user-dropdown").classList.toggle("open");
        }

        document.addEventListener('click', (e) => {
            const dropdown = document.getElementById("user-dropdown");
            if (dropdown && !dropdown.contains(e.target)) {
                dropdown.classList.remove("open");
            }
        });

        function syncNavbarProfile() {
            const savedProfile = JSON.parse(localStorage.getItem("userProfile"));
            const navAvatar = document.getElementById("nav-user-avatar");
            const navName = document.getElementById("nav-user-name");

            if (savedProfile) {
                if (navName && savedProfile.firstName) navName.textContent = savedProfile.firstName;
                if (navAvatar) {
                    if (savedProfile.avatar) {
                        navAvatar.style.backgroundImage = `url('${savedProfile.avatar}')`;
                        navAvatar.style.backgroundSize = "cover";
                        navAvatar.textContent = "";
                    } else {
                        const initials = ((savedProfile.firstName?.[0] || '') + (savedProfile.lastName?.[0] || '')).toUpperCase() || '👤';
                        navAvatar.textContent = initials;
                    }
                }
            }
        }

        function promptApiKey() {
            const currentKey = localStorage.getItem("geminiApiKey") || "";
            const key = prompt("Enter your Google Gemini API Key from Google AI Studio:", currentKey);
            if (key !== null && key.trim() !== "") {
                localStorage.setItem("geminiApiKey", key.trim());
                alert("Gemini API key updated!");
            }
        }

        function appendMessage(text, role) {
            const msg = document.createElement("div");
            msg.className = `message ${role}`;
            msg.textContent = text;
            chatMessages.appendChild(msg);
            chatMessages.scrollTop = chatMessages.scrollHeight;
            return msg;
        }

        async function sendMessage(event) {
            event.preventDefault();
            const text = userInput.value.trim();
            const apiKey = localStorage.getItem("geminiApiKey");

            if (!text) return;

            if (!apiKey) {
                alert("Please add your Gemini API Key first.");
                promptApiKey();
                return;
            }

            appendMessage(text, "user");
            userInput.value = "";
            sendBtn.disabled = true;

            const loadingMsg = appendMessage("Thinking...", "assistant");

            try {
                const savedProfile = localStorage.getItem("userProfile") || "{}";
                const systemPrompt = `You are an AI assistant for the FolioPulse portfolio builder. Current profile: ${savedProfile}. Keep answers helpful and concise.`;

                // Uses gemini-1.5-flash endpoint
                const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=${apiKey}`, {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({
                        contents: [
                            { role: "user", parts: [{ text: `${systemPrompt}\n\nUser: ${text}` }] }
                        ]
                    })
                });

                const data = await response.json();

                if (data.candidates && data.candidates[0].content.parts[0].text) {
                    loadingMsg.textContent = data.candidates[0].content.parts[0].text;
                } else if (data.error) {
                    loadingMsg.textContent = `API Error: ${data.error.message}`;
                } else {
                    loadingMsg.textContent = "Unable to process the response. Please check your API key.";
                }
            } catch (err) {
                loadingMsg.textContent = "Network error: Unable to reach Gemini API.";
            } finally {
                sendBtn.disabled = false;
                chatMessages.scrollTop = chatMessages.scrollHeight;
            }
        }

        function handleLogout(event) {
            event.preventDefault();
            localStorage.removeItem("isLoggedIn");
            localStorage.removeItem("userProfile");
            window.location.href = "signin.html";
        }
    </script>
</body>
</html>
