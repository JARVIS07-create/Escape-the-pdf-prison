<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Upload Resume - FolioPulse</title>
    <link rel="stylesheet" href="style.css">
    <style>
        /* Glass Card Container */
        .upload-wrapper {
            background: rgba(255, 255, 255, 0.88);
            border: 1px solid rgba(226, 232, 240, 0.9);
            border-radius: 16px;
            padding: 40px 30px;
            max-width: 580px;
            margin: 0 auto;
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            box-shadow: 0 20px 40px -15px rgba(15, 23, 42, 0.08);
            text-align: center;
        }

        .upload-card {
            background: #ffffff;
            border: 2px dashed #cbd5e1;
            border-radius: 12px;
            padding: 32px 20px;
            margin: 24px 0;
            transition: border-color 0.2s ease, background-color 0.2s ease;
        }

        .upload-card:hover {
            border-color: #2563eb;
            background-color: #f8fafc;
        }

        .upload-icon {
            font-size: 40px;
            margin-bottom: 10px;
        }

        .choose-file-btn {
            display: inline-block;
            background-color: #f1f5f9;
            color: #1e293b;
            border: 1px solid #cbd5e1;
            padding: 10px 22px;
            border-radius: 6px;
            font-weight: 600;
            font-size: 14px;
            cursor: pointer;
            margin: 14px 0 8px 0;
            transition: all 0.2s ease;
        }

        .choose-file-btn:hover {
            background-color: #e2e8f0;
            border-color: #94a3b8;
        }

        #file-name {
            font-weight: 600;
            color: #2563eb;
            margin-top: 6px;
            font-size: 14px;
        }

        .file-types {
            font-size: 12px;
            color: #94a3b8;
            margin-top: 4px;
        }

        .action-buttons-group {
            display: flex;
            flex-direction: column;
            gap: 10px;
            width: 100%;
        }

        .action-buttons-group button {
            width: 100%;
            margin: 0;
        }

        .action-buttons-group button:disabled {
            background-color: #94a3b8;
            border-color: #94a3b8;
            cursor: not-allowed;
            opacity: 0.7;
        }

        #status-message {
            margin-top: 15px;
            font-weight: 600;
            font-size: 14px;
            color: #2563eb;
            min-height: 20px;
        }

        .back-link {
            display: inline-block;
            margin-top: 20px;
            color: #64748b;
            text-decoration: none;
            font-weight: 600;
            font-size: 14px;
            transition: color 0.2s ease;
        }

        .back-link:hover {
            color: #0f172a;
        }
    </style>
</head>

<body>

    <div class="overlay"></div>

    <header class="navbar">
        <a href="index.html" class="logo">
            <span class="logo-badge">⚡</span> FolioPulse
        </a>

        <div class="nav-right">
            <div class="dropdown" id="userDropdown">
                <button class="dropdown-btn" type="button" onclick="toggleDropdown(event)">
                    <div class="avatar">JS</div>
                    <span>Account</span>
                    <span class="chevron">▼</span>
                </button>
                <div class="dropdown-menu">
                    <a href="profile.html" class="dropdown-item">
                        <span class="item-icon">👤</span> Profile
                    </a>
                    <a href="portfolio.html" class="dropdown-item">
                        <span class="item-icon">🌐</span> My Portfolio
                    </a>
                    <a href="chat.html" class="dropdown-item">
                        <span class="item-icon">💬</span> AI Chat Assistant
                    </a>
                    <div class="dropdown-divider"></div>
                    <a href="index.html" class="dropdown-item" style="color: #ef4444;">
                        <span class="item-icon">🚪</span> Log Out
                    </a>
                </div>
            </div>
        </div>
    </header>

    <main class="container">
        <div class="upload-wrapper">
            <h1>Upload Your <span>Resume</span></h1>
            <p class="description">Turn your resume into a professional showcase website with AI.</p>

            <div class="upload-card">
                <div class="upload-icon">📄</div>
                <h2>Upload your resume</h2>
                <p class="description" style="font-size: 14px;">Choose your resume from your device</p>

                <input 
                    type="file" 
                    id="resume" 
                    accept=".pdf,.jpg,.jpeg,.png" 
                    style="display: none;"
                >

                <label for="resume" class="choose-file-btn">
                    Browse Files
                </label>

                <p id="file-name">No file selected</p>
                <p class="file-types">Supported formats: PDF, JPG, PNG</p>
            </div>

            <div class="action-buttons-group">
                <button 
                    id="analyze-button" 
                    disabled 
                    onclick="analyzeResume()"
                >
                    Analyze My Resume
                </button>

                <button 
                    id="view-button" 
                    class="btn-secondary" 
                    disabled 
                    onclick="viewResume()"
                >
                    👁 View Uploaded Resume
                </button>
            </div>

            <p id="status-message"></p>

            <div>
                <a href="index.html" class="back-link">
                    ← Back to Dashboard
                </a>
            </div>
        </div>
    </main>

    <script>
        // Dropdown toggle logic
        function toggleDropdown(event) {
            event.stopPropagation();
            const dropdown = document.getElementById("userDropdown");
            dropdown.classList.toggle("open");
        }

        // Close dropdown when clicking outside
        window.onclick = function (event) {
            if (!event.target.closest('.dropdown')) {
                const dropdown = document.getElementById("userDropdown");
                if (dropdown && dropdown.classList.contains('open')) {
                    dropdown.classList.remove('open');
                }
            }
        };

        // DOM elements
        const resumeInput = document.getElementById("resume");
        const fileName = document.getElementById("file-name");
        const analyzeButton = document.getElementById("analyze-button");
        const viewButton = document.getElementById("view-button");
        const statusMessage = document.getElementById("status-message");

        // File selection handler
        resumeInput.addEventListener("change", function () {
            if (resumeInput.files.length > 0) {
                const file = resumeInput.files[0];
                fileName.textContent = file.name;

                analyzeButton.disabled = false;
                viewButton.disabled = false;
                statusMessage.textContent = "";
            }
        });

        // Backend upload & analysis call
        async function analyzeResume() {
            const file = resumeInput.files[0];

            if (!file) {
                alert("Please select your resume first.");
                return;
            }

            analyzeButton.textContent = "Analyzing...";
            analyzeButton.disabled = true;
            statusMessage.textContent = "AI is analyzing your resume... Please wait.";

            const formData = new FormData();
            formData.append("resume", file);

            try {
                const response = await fetch("/analyze-resume", {
                    method: "POST",
                    body: formData
                });

                const result = await response.json();
                console.log("Gemini Result:", result);

                if (result.success) {
                    statusMessage.textContent = "Resume analyzed successfully!";
                    console.log("Extracted Data:", result.data);
                    alert("Resume analyzed successfully! Check the browser console.");
                } else {
                    statusMessage.textContent = "AI could not analyze the resume.";
                    console.error("Analysis Error:", result.error);
                    alert("Error: " + result.error);
                }
            } catch (error) {
                console.error("Server Error:", error);
                statusMessage.textContent = "Could not connect to the AI server.";
                alert("Could not connect to the Python backend server.");
            } finally {
                analyzeButton.textContent = "Analyze My Resume";
                analyzeButton.disabled = false;
            }
        }

        // Open selected file in a preview tab
        function viewResume() {
            const file = resumeInput.files[0];
            if (file) {
                const fileURL = URL.createObjectURL(file);
                window.open(fileURL, "_blank");
            }
        }
    </script>

</body>

</html>
