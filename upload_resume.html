<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Upload Resume - FolioPulse</title>

    <link rel="stylesheet" href="style.css">

    <style>
        .upload-wrapper {
            background: rgba(255, 255, 255, 0.88);
            border: 1px solid rgba(226, 232, 240, 0.9);
            border-radius: 16px;
            padding: 40px 30px;
            max-width: 580px;
            margin: 0 auto;
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            box-shadow: 0 20px 40px -15px rgba(15, 23, 42, 0.08);
            text-align: center;
        }

        .upload-card {
            background: #ffffff;
            border: 2px dashed #cbd5e1;
            border-radius: 12px;
            padding: 32px 20px;
            margin: 24px 0;
            transition: all 0.2s ease;
            cursor: pointer;
        }

        .upload-card.dragover {
            border-color: #2563eb;
            background-color: #eff6ff;
            transform: scale(1.01);
        }

        .upload-icon {
            font-size: 40px;
            margin-bottom: 10px;
            display: inline-block;
        }

        .choose-file-btn {
            display: inline-block;
            background-color: #f1f5f9;
            color: #1e293b;
            border: 1px solid #cbd5e1;
            padding: 10px 22px;
            border-radius: 6px;
            font-weight: 600;
            font-size: 14px;
            cursor: pointer;
            margin: 14px 0 8px 0;
            transition: all 0.2s ease;
        }

        .choose-file-btn:hover {
            background-color: #e2e8f0;
            border-color: #94a3b8;
        }

        #file-name {
            font-weight: 600;
            color: #2563eb;
            margin-top: 6px;
            font-size: 14px;
            word-break: break-all;
        }

        .file-types {
            font-size: 12px;
            color: #94a3b8;
            margin-top: 4px;
        }

        .action-buttons-group {
            display: flex;
            flex-direction: column;
            gap: 12px;
            width: 100%;
        }

        .action-buttons-group button {
            width: 100%;
            margin: 0;
        }

        .action-buttons-group button:disabled {
            background-color: #cbd5e1;
            border-color: #cbd5e1;
            color: #94a3b8;
            cursor: not-allowed;
            transform: none;
            box-shadow: none;
        }

        #status-message {
            margin-top: 16px;
            font-weight: 600;
            font-size: 14px;
            min-height: 20px;
        }

        .status-success {
            color: #059669;
        }

        .status-error {
            color: #dc2626;
        }

        .status-loading {
            color: #2563eb;
        }

        #result {
            text-align: left;
        }

        .portfolio-result h2 {
            color: #0f172a;
        }

        .portfolio-result h3 {
            color: #2563eb;
            font-size: 24px;
            margin-bottom: 8px;
        }

        .portfolio-result h4 {
            margin-top: 20px;
            color: #0f172a;
        }

        .skills-container {
            margin-top: 8px;
        }

        .skill-badge {
            display: inline-block;
            background: #eff6ff;
            color: #2563eb;
            padding: 7px 12px;
            margin: 4px;
            border-radius: 20px;
            font-size: 13px;
            font-weight: 600;
        }

        .project-card,
        .experience-card,
        .education-card {
            padding: 12px;
            margin: 8px 0;
            background: #f8fafc;
            border-radius: 8px;
            border: 1px solid #e2e8f0;
        }

        .link-item {
            word-break: break-all;
        }

        .back-link {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            margin-top: 24px;
            color: #64748b;
            text-decoration: none;
            font-weight: 600;
            font-size: 14px;
            transition: color 0.2s ease;
        }

        .back-link:hover {
            color: #0f172a;
        }

        @media (max-width: 640px) {
            .upload-wrapper {
                padding: 24px 16px;
            }

            .upload-card {
                padding: 24px 14px;
            }
        }
    </style>

</head>

<body>

    <div class="overlay"></div>

    <!-- NAVBAR -->

    <header class="navbar">

        <a href="index.html" class="logo">
            <span class="logo-badge">⚡</span>
            FolioPulse
        </a>

        <div class="nav-right">

            <div class="dropdown" id="user-dropdown">

                <button
                    class="dropdown-btn"
                    type="button"
                    onclick="toggleDropdown(event)"
                >

                    <div class="avatar" id="nav-user-avatar">
                        👤
                    </div>

                    <span id="nav-user-name">
                        Menu
                    </span>

                    <span class="chevron">
                        ▼
                    </span>

                </button>

                <div class="dropdown-menu">

                    <a href="profile.html" class="dropdown-item">
                        <span class="item-icon">👤</span>
                        Profile
                    </a>

                    <a href="portfolio.html" class="dropdown-item">
                        <span class="item-icon">📁</span>
                        My Portfolios
                    </a>

                    <a href="chat.html" class="dropdown-item">
                        <span class="item-icon">🤖</span>
                        AI Chat Box
                    </a>

                    <div class="dropdown-divider"></div>

                    <a
                        href="index.html"
                        class="dropdown-item logout-link"
                        onclick="logout(event)"
                    >
                        <span class="item-icon">🚪</span>
                        Sign Out
                    </a>

                </div>

            </div>

        </div>

    </header>

    <!-- MAIN CONTENT -->

    <main class="container">

        <div class="upload-wrapper">

            <h1
                class="hero-title"
                style="font-size: 32px; margin-bottom: 8px;"
            >
                Upload Your
                <span>Resume</span>
            </h1>

            <p
                class="hero-subtitle"
                style="margin-bottom: 20px; font-size: 14px;"
            >
                Turn your resume into a professional
                showcase website with AI.
            </p>

            <!-- UPLOAD AREA -->

            <div
                class="upload-card"
                id="drop-zone"
            >

                <div class="upload-icon">
                    📄
                </div>

                <h3
                    style="
                        font-size: 16px;
                        color: #0f172a;
                        margin-bottom: 4px;
                    "
                >
                    Upload your resume
                </h3>

                <p
                    style="
                        font-size: 13px;
                        color: #64748b;
                    "
                >
                    Drag and drop or browse from your device
                </p>

                <input
                    type="file"
                    id="resume"
                    accept=".pdf,.docx,application/pdf,application/vnd.openxmlformats-officedocument.wordprocessingml.document"
                    style="display: none;"
                >

                <label
                    for="resume"
                    class="choose-file-btn"
                >
                    Browse Files
                </label>

                <p id="file-name">
                    No file selected
                </p>

                <p class="file-types">
                    Supported formats:
                    PDF, DOCX (Max 10MB)
                </p>

            </div>

            <!-- BUTTONS -->

            <div class="action-buttons-group">

                <button
                    type="button"
                    id="analyze-button"
                    class="btn-primary"
                    disabled
                >
                    ⚡ Analyze My Resume
                </button>

                <!-- RESULT -->

                <div
                    id="result"
                    style="
                        display: none;
                        margin-top: 20px;
                        padding: 20px;
                        background: white;
                        border-radius: 10px;
                        color: black;
                        border: 1px solid #e2e8f0;
                    "
                >
                </div>

                <!-- PREVIEW -->

                <button
                    type="button"
                    id="view-button"
                    class="btn-secondary"
                    disabled
                >
                    👁 Preview Uploaded File
                </button>

            </div>

            <!-- STATUS -->

            <p id="status-message"></p>

            <!-- BACK -->

            <div>

                <a
                    href="index.html?authenticated=true"
                    class="back-link"
                >
                    ← Back to Dashboard
                </a>

            </div>

        </div>

    </main>

    <!-- JAVASCRIPT -->

    <script>

        // ==========================================
        // DOM ELEMENTS
        // ==========================================

        const resumeInput =
            document.getElementById("resume");

        const fileName =
            document.getElementById("file-name");

        const dropZone =
            document.getElementById("drop-zone");

        const analyzeButton =
            document.getElementById("analyze-button");

        const viewButton =
            document.getElementById("view-button");

        const statusMessage =
            document.getElementById("status-message");

        const resultContainer =
            document.getElementById("result");


        // ==========================================
        // FILE VALIDATION
        // ==========================================

        function validateFile(file) {

            if (!file) {
                return false;
            }

            const fileNameLower =
                file.name.toLowerCase();

            const isPDF =
                file.type === "application/pdf" ||
                fileNameLower.endsWith(".pdf");

            const isDOCX =
                file.type ===
                "application/vnd.openxmlformats-officedocument.wordprocessingml.document" ||
                fileNameLower.endsWith(".docx");

            if (!isPDF && !isDOCX) {

                alert(
                    "Please upload a PDF or DOCX file."
                );

                return false;
            }

            if (file.size > 10 * 1024 * 1024) {

                alert(
                    "File size must be less than 10 MB."
                );

                return false;
            }

            return true;
        }


        // ==========================================
        // FILE SELECTION
        // ==========================================

        resumeInput.addEventListener(
            "change",
            function () {

                if (
                    resumeInput.files &&
                    resumeInput.files.length > 0
                ) {

                    handleFileSelect(
                        resumeInput.files[0]
                    );
                }
            }
        );


        function handleFileSelect(file) {

            if (!validateFile(file)) {

                resumeInput.value = "";

                analyzeButton.disabled = true;

                viewButton.disabled = true;

                fileName.textContent =
                    "No file selected";

                return;
            }

            fileName.textContent =
                file.name;

            analyzeButton.disabled =
                false;

            viewButton.disabled =
                false;

            statusMessage.textContent =
                "";

            statusMessage.className =
                "";

            resultContainer.style.display =
                "none";
        }


        // ==========================================
        // DRAG AND DROP
        // ==========================================

        ["dragenter", "dragover"].forEach(
            eventName => {

                dropZone.addEventListener(
                    eventName,
                    function (e) {

                        e.preventDefault();
                        e.stopPropagation();

                        dropZone.classList.add(
                            "dragover"
                        );
                    }
                );
            }
        );


        ["dragleave", "drop"].forEach(
            eventName => {

                dropZone.addEventListener(
                    eventName,
                    function (e) {

                        e.preventDefault();
                        e.stopPropagation();

                        dropZone.classList.remove(
                            "dragover"
                        );
                    }
                );
            }
        );


        dropZone.addEventListener(
            "drop",
            function (e) {

                const files =
                    e.dataTransfer.files;

                if (
                    files &&
                    files.length > 0
                ) {

                    const file =
                        files[0];

                    const dataTransfer =
                        new DataTransfer();

                    dataTransfer.items.add(file);

                    resumeInput.files =
                        dataTransfer.files;

                    handleFileSelect(file);
                }
            }
        );


        // ==========================================
        // CLICK UPLOAD AREA
        // ==========================================

        dropZone.addEventListener(
            "click",
            function (e) {

                if (
                    e.target.tagName !== "LABEL"
                ) {

                    resumeInput.click();
                }
            }
        );


        // ==========================================
        // PREVIEW ORIGINAL RESUME
        // ==========================================

        viewButton.addEventListener(
            "click",
            function () {

                const file =
                    resumeInput.files[0];

                if (!file) {

                    alert(
                        "Please select a resume first."
                    );

                    return;
                }

                const fileURL =
                    URL.createObjectURL(file);

                window.open(
                    fileURL,
                    "_blank"
                );
            }
        );


        // ==========================================
        // ANALYZE RESUME
        // ==========================================

        analyzeButton.addEventListener(
            "click",
            analyzeResume
        );


        // ==========================================
        // ANALYZE RESUME FUNCTION
        // ==========================================

        async function analyzeResume() {

            const file =
                resumeInput.files[0];

            if (!file) {

                alert(
                    "Please select your resume first."
                );

                return;
            }

            if (!validateFile(file)) {
                return;
            }


            // BUTTON STATE

            analyzeButton.disabled =
                true;

            viewButton.disabled =
                true;

            analyzeButton.textContent =
                "⚡ Analyzing with AI...";

            statusMessage.textContent =
                "Gemini is analyzing your resume. Please wait...";

            statusMessage.className =
                "status-loading";


            // FORM DATA

            const formData =
                new FormData();

            formData.append(
                "resume",
                file
            );


            try {

                // SEND FILE TO FLASK

                const response =
                    await fetch(
                        "/analyze-resume",
                        {
                            method: "POST",
                            body: formData
                        }
                    );


                // READ RESPONSE AS TEXT FIRST
                // This prevents:
                // Unexpected token '<'

                const responseText =
                    await response.text();

                console.log(
                    "Server response:",
                    responseText
                );


                // CHECK SERVER STATUS

                if (!response.ok) {

                    throw new Error(
                        "Server error: " +
                        response.status +
                        " " +
                        response.statusText
                    );
                }


                // CONVERT TEXT TO JSON

                let data;

                try {

                    data =
                        JSON.parse(responseText);

                } catch (jsonError) {

                    console.error(
                        "Server returned:",
                        responseText
                    );

                    throw new Error(
                        "The server returned HTML instead of JSON. " +
                        "Please check your Flask backend and /analyze-resume route."
                    );
                }


                console.log(
                    "Flask response:",
                    data
                );


                // CHECK SUCCESS

                if (!data.success) {

                    throw new Error(
                        data.message ||
                        "Unable to analyze the resume."
                    );
                }


                // SHOW RESULT

                resultContainer.style.display =
                    "block";


                resultContainer.innerHTML = `

                    <div class="portfolio-result">

                        <h2>
                            Resume Analysis
                        </h2>

                        <h3>
                            ${escapeHTML(
                                data.name ||
                                "Your Resume"
                            )}
                        </h3>


                        <h4>
                            Summary
                        </h4>

                        <p>
                            ${escapeHTML(
                                data.summary ||
                                "No summary available."
                            )}
                        </p>


                        <h4>
                            Skills
                        </h4>

                        <div class="skills-container">

                            ${
