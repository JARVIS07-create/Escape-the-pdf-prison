<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Upload Resume - FolioPulse</title>
    <link rel="stylesheet" href="style.css">
    <style>
        .upload-wrapper {
            background: rgba(255, 255, 255, 0.88);
            border: 1px solid rgba(226, 232, 240, 0.9);
            border-radius: 16px;
            padding: 40px 30px;
            max-width: 580px;
            margin: 0 auto;
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            box-shadow: 0 20px 40px -15px rgba(15, 23, 42, 0.08);
            text-align: center;
        }

        .upload-card {
            background: #ffffff;
            border: 2px dashed #cbd5e1;
            border-radius: 12px;
            padding: 32px 20px;
            margin: 24px 0;
            transition: all 0.2s ease;
            cursor: pointer;
        }

        .upload-card.dragover {
            border-color: #2563eb;
            background-color: #eff6ff;
            transform: scale(1.01);
        }

        .upload-icon {
            font-size: 40px;
            margin-bottom: 10px;
            display: inline-block;
        }

        .choose-file-btn {
            display: inline-block;
            background-color: #f1f5f9;
            color: #1e293b;
            border: 1px solid #cbd5e1;
            padding: 10px 22px;
            border-radius: 6px;
            font-weight: 600;
            font-size: 14px;
            cursor: pointer;
            margin: 14px 0 8px 0;
            transition: all 0.2s ease;
        }

        .choose-file-btn:hover {
            background-color: #e2e8f0;
            border-color: #94a3b8;
        }

        #file-name {
            font-weight: 600;
            color: #2563eb;
            margin-top: 6px;
            font-size: 14px;
            word-break: break-all;
        }

        .file-types {
            font-size: 12px;
            color: #94a3b8;
            margin-top: 4px;
        }

        .action-buttons-group {
            display: flex;
            flex-direction: column;
            gap: 12px;
            width: 100%;
        }

        .action-buttons-group button {
            width: 100%;
            margin: 0;
        }

        .action-buttons-group button:disabled {
            background-color: #cbd5e1;
            border-color: #cbd5e1;
            color: #94a3b8;
            cursor: not-allowed;
            transform: none;
            box-shadow: none;
        }

        #status-message {
            margin-top: 16px;
            font-weight: 600;
            font-size: 14px;
            min-height: 20px;
        }

        .status-success { color: #059669; }
        .status-error { color: #dc2626; }
        .status-loading { color: #2563eb; }

        .back-link {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            margin-top: 24px;
            color: #64748b;
            text-decoration: none;
            font-weight: 600;
            font-size: 14px;
            transition: color 0.2s ease;
        }

        .back-link:hover {
            color: #0f172a;
        }

        @media (max-width: 640px) {
            .upload-wrapper {
                padding: 24px 16px;
            }
            .upload-card {
                padding: 24px 14px;
            }
        }
    </style>
</head>
<body>

    <div class="overlay"></div>

    <header class="navbar">
        <a href="index.html" class="logo">
            <span class="logo-badge">⚡</span> FolioPulse
        </a>

        <div class="nav-right">
            <div class="dropdown" id="user-dropdown">
                <button class="dropdown-btn" type="button" onclick="toggleDropdown(event)">
                    <div class="avatar" id="nav-user-avatar">👤</div>
                    <span id="nav-user-name">Menu</span>
                    <span class="chevron">▼</span>
                </button>
                <div class="dropdown-menu">
                    <a href="profile.html" class="dropdown-item">
                        <span class="item-icon">👤</span> Profile
                    </a>
                    <a href="portfolio.html" class="dropdown-item">
                        <span class="item-icon">📁</span> My Portfolios
                    </a>
                    <a href="chat.html" class="dropdown-item">
                        <span class="item-icon">🤖</span> AI Chat Box
                    </a>
                    <div class="dropdown-divider"></div>
                    <a href="index.html" class="dropdown-item logout-link" onclick="logout(event)">
                        <span class="item-icon">🚪</span> Sign Out
                    </a>
                </div>
            </div>
        </div>
    </header>

    <main class="container">
        <div class="upload-wrapper">
            <h1 class="hero-title" style="font-size: 32px; margin-bottom: 8px;">Upload Your <span>Resume</span></h1>
            <p class="hero-subtitle" style="margin-bottom: 20px; font-size: 14px;">Turn your resume into a professional showcase website with AI.</p>

            <div class="upload-card" id="drop-zone" onclick="document.getElementById('resume').click()">
                <div class="upload-icon">📄</div>
                <h3 style="font-size: 16px; color: #0f172a; margin-bottom: 4px;">Upload your resume</h3>
                <p style="font-size: 13px; color: #64748b;">Drag and drop or browse from your device</p>

                <input 
                    type="file" 
                    id="resume" 
                    accept=".pdf,.docx" 
                    style="display: none;"
                    onclick="event.stopPropagation()"
                >

                <label for="resume" class="choose-file-btn" onclick="event.stopPropagation()">
                    Browse Files
                </label>

                <p id="file-name">No file selected</p>
                <p class="file-types">Supported formats: PDF, DOCX (Max 10MB)</p>
            </div>

            <div class="action-buttons-group">
                <button 
                    type="button"
                    id="analyze-button" 
                    class="btn-primary"
                    disabled 
                    onclick="analyzeResume()"
                >
                    ⚡ Analyze My Resume
                </button>

                <div
                   id="result"
                   style="
                       display: none;
                       margin-top: 20px;
                       padding: 20px;
                       background: white;
                       border-radius: 10px;
                       color: black;
                       white-space: pre-wrap;
                       text-align: left;
                       border: 1px solid #e2e8f0;
                     ">
                </div>

                <button 
                    type="button"
                    id="view-button" 
                    class="btn-secondary" 
                    disabled 
                    onclick="viewResume()"
                >
                    👁 Preview Uploaded File
                </button>
            </div>

            <p id="status-message"></p>

            <div>
                <a href="index.html?authenticated=true" class="back-link">
                    ← Back to Dashboard
                </a>
            </div>
        </div>
    </main>

    <script>
        // Synchronize navbar profile with LocalStorage
        function syncNavbarProfile() {
            const savedProfile = JSON.parse(localStorage.getItem("userProfile"));
            const navAvatar = document.getElementById("nav-user-avatar");
            const navName = document.getElementById("nav-user-name");

            if (savedProfile) {
                if (navName && savedProfile.firstName) {
                    navName.textContent = savedProfile.firstName;
                }
                if (navAvatar) {
                    if (savedProfile.avatar) {
                        navAvatar.style.backgroundImage = `url('${savedProfile.avatar}')`;
                        navAvatar.style.backgroundSize = "cover";
                        navAvatar.textContent = "";
                    } else {
                        const initials = ((savedProfile.firstName?.[0] || '') + (savedProfile.lastName?.[0] || '')).toUpperCase() || '👤';
                        navAvatar.textContent = initials;
                    }
                }
            }
        }

        document.addEventListener("DOMContentLoaded", syncNavbarProfile);

        // Dropdown toggle logic
        function toggleDropdown(event) {
            event.stopPropagation();
            document.getElementById("user-dropdown").classList.toggle("open");
        }

        window.onclick = function (event) {
            const dropdown = document.getElementById("user-dropdown");
            if (dropdown && !dropdown.contains(event.target)) {
                dropdown.classList.remove("open");
            }
        };

        function logout(event) {
            event.preventDefault();
            localStorage.removeItem("isLoggedIn");
            localStorage.removeItem("userProfile");
            window.location.href = "index.html";
        }

        // DOM Elements
        const resumeInput = document.getElementById("resume");
        const fileName = document.getElementById("file-name");
        const dropZone = document.getElementById("drop-zone");
        const analyzeButton = document.getElementById("analyze-button");
        const viewButton = document.getElementById("view-button");
        const statusMessage = document.getElementById("status-message");
        const resultContainer = document.getElementById("result");

        // Drag and Drop handlers
        ['dragenter', 'dragover'].forEach(eventName => {
            dropZone.addEventListener(eventName, (e) => {
                e.preventDefault();
                e.stopPropagation();
                dropZone.classList.add('dragover');
            });
        });

        ['dragleave', 'drop'].forEach(eventName => {
            dropZone.addEventListener(eventName, (e) => {
                e.preventDefault();
                e.stopPropagation();
                dropZone.classList.remove('dragover');
            });
        });

        dropZone.addEventListener('drop', (e) => {
            const dt = e.dataTransfer;
            const files = dt.files;
            if (files.length > 0) {
                resumeInput.files = files;
                handleFileSelect(files[0]);
            }
        });

        // File selection handler
        resumeInput.addEventListener("change", function () {
            if (resumeInput.files.length > 0) {
                handleFileSelect(resumeInput.files[0]);
            }
        });

        function handleFileSelect(file) {
            fileName.textContent = file.name;
            analyzeButton.disabled = false;
            viewButton.disabled = false;
            statusMessage.textContent = "";
            statusMessage.className = "";
        }

        // Preview local file in a new tab
        function viewResume() {
            const file = resumeInput.files[0];
            if (file) {
                const fileURL = URL.createObjectURL(file);
                window.open(fileURL, '_blank');
            } else {
                alert("Please select a file first.");
            }
        }

        // Backend upload & analysis call to app.py
        async function analyzeResume() {
            const file = resumeInput.files[0];

            if (!file) {
                alert("Please select your resume first.");
                return;
            }

            analyzeButton.textContent = "Analyzing with AI...";
            analyzeButton.disabled = true;
            statusMessage.textContent = "AI is extracting skills, bio, and resume details...";
            statusMessage.className = "status-loading";

            const formData = new FormData();
            formData.append("resume", file);

            try {
                // Dynamic URL works whether running through localhost:5000 or external port
                const targetUrl = window.location.hostname === "127.0.0.1" || window.location.hostname === "localhost"
                    ? "/analyze-resume"
                    : "http://127.0.0.1:5000/analyze-resume";

                const response = await fetch(targetUrl, {
                    method: "POST",
                    body: formData
                });

                const data = await response.json();

                if (response.ok && data.success) {
                    statusMessage.textContent = "✓ Resume analyzed successfully! Saving data...";
                    statusMessage.className = "status-success";

                    let parsedProfile = {};
                    try {
                        const cleanJson = (data.raw_analysis || data.data).replace(/```json|```/g, "").trim();
                        parsedProfile = JSON.parse(cleanJson);
                    } catch (e) {
                        parsedProfile = { bio: data.raw_analysis || data.data };
                    }

                    // Save parsed result into LocalStorage
                    const existingProfile = JSON.parse(localStorage.getItem("userProfile")) || {};
                    const mergedProfile = { ...existingProfile, ...parsedProfile };
                    localStorage.setItem("userProfile", JSON.stringify(mergedProfile));

                    // Display JSON preview on screen
                    resultContainer.style.display = "block";
                    resultContainer.textContent = JSON.stringify(parsedProfile, null, 2);

                    // Redirect to portfolio after 2 seconds
                    setTimeout(() => {
                        window.location.href = "portfolio.html";
                    }, 2000);

                } else {
                    statusMessage.textContent = `Error: ${data.error || "Failed to analyze resume."}`;
                    statusMessage.className = "status-error";
                    analyzeButton.disabled = false;
                    analyzeButton.textContent = "⚡ Analyze My Resume";
                }
            } catch (err) {
                console.error("Connection error:", err);
                statusMessage.textContent = "Unable to connect to backend server. Make sure app.py is running on port 5000.";
                statusMessage.className = "status-error";
                analyzeButton.disabled = false;
                analyzeButton.textContent = "⚡ Analyze My Resume";
            }
        }
    </script>
</body>
</html>
