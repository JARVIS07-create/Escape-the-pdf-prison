<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Upload Resume - FolioPulse</title>

    <link rel="stylesheet" href="style.css">

    <style>

        .upload-wrapper {
            background: rgba(255, 255, 255, 0.88);
            border: 1px solid rgba(226, 232, 240, 0.9);
            border-radius: 16px;
            padding: 40px 30px;
            max-width: 580px;
            margin: 0 auto;

            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);

            box-shadow: 0 20px 40px -15px rgba(15, 23, 42, 0.08);

            text-align: center;
        }


        .upload-card {
            background: #ffffff;
            border: 2px dashed #cbd5e1;
            border-radius: 12px;

            padding: 32px 20px;
            margin: 24px 0;

            transition: all 0.2s ease;
            cursor: pointer;
        }


        .upload-card.dragover {
            border-color: #2563eb;
            background-color: #eff6ff;
            transform: scale(1.01);
        }


        .upload-icon {
            font-size: 40px;
            margin-bottom: 10px;
            display: inline-block;
        }


        .choose-file-btn {
            display: inline-block;

            background-color: #f1f5f9;
            color: #1e293b;

            border: 1px solid #cbd5e1;

            padding: 10px 22px;

            border-radius: 6px;

            font-weight: 600;
            font-size: 14px;

            cursor: pointer;

            margin: 14px 0 8px 0;

            transition: all 0.2s ease;
        }


        .choose-file-btn:hover {
            background-color: #e2e8f0;
            border-color: #94a3b8;
        }


        #file-name {
            font-weight: 600;
            color: #2563eb;

            margin-top: 6px;

            font-size: 14px;

            word-break: break-all;
        }


        .file-types {
            font-size: 12px;
            color: #94a3b8;

            margin-top: 4px;
        }


        .action-buttons-group {
            display: flex;
            flex-direction: column;

            gap: 12px;

            width: 100%;
        }


        .action-buttons-group button {
            width: 100%;
            margin: 0;
        }


        .action-buttons-group button:disabled {
            background-color: #cbd5e1;
            border-color: #cbd5e1;

            color: #94a3b8;

            cursor: not-allowed;

            transform: none;

            box-shadow: none;
        }


        #status-message {
            margin-top: 16px;

            font-weight: 600;
            font-size: 14px;

            min-height: 20px;
        }


        .status-success {
            color: #059669;
        }


        .status-error {
            color: #dc2626;
        }


        .status-loading {
            color: #2563eb;
        }


        #result {
            text-align: left;
        }


        .portfolio-result h2 {
            color: #0f172a;
        }


        .portfolio-result h3 {
            color: #2563eb;

            font-size: 24px;

            margin-bottom: 8px;
        }


        .portfolio-result h4 {
            margin-top: 20px;

            color: #0f172a;
        }


        .skills-container {
            margin-top: 8px;
        }


        .skill-badge {
            display: inline-block;

            background: #eff6ff;

            color: #2563eb;

            padding: 7px 12px;

            margin: 4px;

            border-radius: 20px;

            font-size: 13px;

            font-weight: 600;
        }


        .project-card {
            padding: 12px;

            margin: 8px 0;

            background: #f8fafc;

            border-radius: 8px;

            border: 1px solid #e2e8f0;
        }


        .experience-card {
            padding: 12px;

            margin: 8px 0;

            background: #f8fafc;

            border-radius: 8px;

            border: 1px solid #e2e8f0;
        }


        .education-card {
            padding: 12px;

            margin: 8px 0;

            background: #f8fafc;

            border-radius: 8px;

            border: 1px solid #e2e8f0;
        }


        .link-item {
            word-break: break-all;
        }


        .back-link {
            display: inline-flex;

            align-items: center;

            gap: 6px;

            margin-top: 24px;

            color: #64748b;

            text-decoration: none;

            font-weight: 600;

            font-size: 14px;

            transition: color 0.2s ease;
        }


        .back-link:hover {
            color: #0f172a;
        }


        @media (max-width: 640px) {

            .upload-wrapper {
                padding: 24px 16px;
            }

            .upload-card {
                padding: 24px 14px;
            }

        }

    </style>

</head>
