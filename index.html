<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FolioPulse - AI Portfolio Builder</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background: #0f172a;
            color: white;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        /* Navbar */
        .navbar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 20px 8%;
            background: rgba(15, 23, 42, 0.9);
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
            position: sticky;
            top: 0;
            z-index: 100;
            backdrop-filter: blur(10px);
        }

        .logo {
            font-size: 24px;
            font-weight: bold;
            color: #ffffff;
            text-decoration: none;
        }

        .nav-links {
            display: flex;
            align-items: center;
            gap: 20px;
        }

        .nav-links a {
            color: #cbd5e1;
            text-decoration: none;
            font-size: 15px;
            transition: color 0.2s ease;
        }

        .nav-links a:hover {
            color: #ffffff;
        }

        .nav-btn {
            padding: 9px 18px;
            border-radius: 8px;
            font-weight: 600;
        }

        .nav-btn.primary {
            background: #3b82f6;
            color: white !important;
            transition: background 0.2s ease;
        }

        .nav-btn.primary:hover {
            background: #2563eb;
        }

        /* Hero Section */
        .hero-section {
            flex: 1;
            display: flex;
            justify-content: center;
            align-items: center;
            text-align: center;
            padding: 80px 20px;
            background: radial-gradient(circle at center, #1e3a8a 0%, #0f172a 70%);
        }

        .hero-content {
            max-width: 750px;
        }

        .hero-content h1 {
            font-size: 48px;
            line-height: 1.2;
            margin-bottom: 20px;
            font-weight: 800;
        }

        .hero-content p {
            font-size: 18px;
            color: #94a3b8;
            margin-bottom: 35px;
            line-height: 1.6;
        }

        .cta-group {
            display: flex;
            justify-content: center;
            gap: 15px;
            flex-wrap: wrap;
        }

        .cta-button {
            padding: 14px 28px;
            font-size: 16px;
            font-weight: bold;
            border-radius: 8px;
            text-decoration: none;
            background: #3b82f6;
            color: white;
            transition: all 0.2s ease;
        }

        .cta-button:hover {
            background: #2563eb;
            transform: translateY(-2px);
        }

        .cta-button.secondary {
            background: transparent;
            border: 1px solid #475569;
            color: #e2e8f0;
        }

        .cta-button.secondary:hover {
            border-color: #38bdf8;
            color: white;
            background: rgba(255, 255, 255, 0.05);
        }

        @media (max-width: 600px) {
            .hero-content h1 {
                font-size: 32px;
            }
            .hero-content p {
                font-size: 16px;
            }
        }
    </style>
</head>
<body>

    <!-- Navigation Bar -->
    <nav class="navbar">
        <a href="index.html" class="logo">⚡ FolioPulse</a>
        <div class="nav-links">
            <a href="index.html">Home</a>
            <a href="signin.html" class="nav-btn">Sign In</a>
            <a href="signup.html" class="nav-btn primary">Create Account</a>
        </div>
    </nav>

    <!-- Main Hero / Dashboard View -->
    <main class="hero-section">
        <div class="hero-content">
            <h1>Build Your Professional Portfolio in Seconds</h1>
            <p>Showcase your work, highlight skills, and stand out to recruiters effortlessly with AI-powered suggestions.</p>
            
            <div class="cta-group">
                <!-- Replaced 'Upload Resume' with 'Edit Portfolio' -->
                <a href="upload_resume.html" class="cta-button">Edit Portfolio</a>
                <a href="signup.html" class="cta-button secondary">Get Started Free</a>
            </div>
        </div>
    </main>

</body>
</html>
