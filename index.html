<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign In | FolioPulse</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #0b0f19;
            color: white;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .office-bg {
            position: fixed; inset: 0; z-index: 0;
            background: linear-gradient(to bottom, rgba(11, 15, 25, 0.82), rgba(11, 15, 25, 0.95)),
                        url('https://images.unsplash.com/photo-1497366216548-37526070297c?auto=format&fit=crop&w=1920&q=80') center/cover no-repeat;
            pointer-events: none;
        }
        .auth-card {
            position: relative; z-index: 10;
            width: 100%; max-width: 420px;
            background: rgba(15, 23, 42, 0.85);
            padding: 40px; border-radius: 20px;
            border: 1px solid rgba(255, 255, 255, 0.12);
            backdrop-filter: blur(16px);
            box-shadow: 0 25px 50px rgba(0,0,0,0.5);
        }
        .logo { text-align: center; font-size: 26px; font-weight: bold; margin-bottom: 8px; }
        h2 { text-align: center; font-size: 22px; margin-bottom: 6px; }
        .subtitle { text-align: center; color: #94a3b8; font-size: 14px; margin-bottom: 25px; }
        .form-group { margin-bottom: 18px; }
        label { display: block; margin-bottom: 6px; font-size: 13px; color: #cbd5e1; }
        input {
            width: 100%; padding: 12px; border-radius: 8px;
            border: 1px solid #334155; background: rgba(30, 41, 59, 0.7);
            color: white; font-size: 14px; outline: none;
        }
        input:focus { border-color: #38bdf8; }
        .submit-btn {
            width: 100%; padding: 13px; margin-top: 10px; border: none;
            border-radius: 8px; background: #3b82f6; color: white;
            font-weight: bold; font-size: 15px; cursor: pointer;
        }
        .submit-btn:hover { background: #2563eb; }
        .switch-text { text-align: center; margin-top: 20px; color: #94a3b8; font-size: 14px; }
        .switch-text a { color: #38bdf8; text-decoration: none; font-weight: 600; }
        .back-home { display: block; text-align: center; margin-top: 16px; color: #64748b; font-size: 13px; text-decoration: none; }
    </style>
</head>
<body>
    <div class="office-bg"></div>
    <div class="auth-card">
        <div class="logo">⚡ FolioPulse</div>
        <h2>Welcome Back</h2>
        <p class="subtitle">Sign in to access your portfolio dashboard.</p>
        <form onsubmit="handleSignIn(event)">
            <div class="form-group">
                <label for="email">Email Address</label>
                <input type="email" id="email" placeholder="Enter your email" required>
            </div>
            <div class="form-group">
                <label for="password">Password</label>
                <input type="password" id="password" placeholder="Enter your password" required>
            </div>
            <button type="submit" class="submit-btn">Sign In</button>
        </form>
        <p class="switch-text">Don't have an account? <a href="signup.html">Create Account</a></p>
        <a href="index.html" class="back-home">← Back to Home</a>
    </div>

    <script>
        function handleSignIn(event) {
            event.preventDefault();
            // Redirects to index.html with authenticated state enabled
            window.location.href = "index.html?authenticated=true";
        }
    </script>
</body>
</html>
