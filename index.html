<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Resume Analyzer</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: #f4f6f9;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
        }

        .upload-card {
            background: #ffffff;
            border-radius: 12px;
            padding: 32px;
            width: 100%;
            max-width: 480px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.08);
            text-align: center;
        }

        .drop-zone {
            border: 2px dashed #cbd5e1;
            border-radius: 8px;
            padding: 32px 16px;
            background: #fafafa;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .drop-zone:hover, .drop-zone.dragover {
            border-color: #2563eb;
            background: #eff6ff;
        }

        .file-icon {
            font-size: 32px;
            margin-bottom: 8px;
        }

        .file-name {
            margin-top: 12px;
            color: #2563eb;
            font-weight: 600;
            font-size: 14px;
        }

        .btn {
            width: 100%;
            padding: 12px;
            border-radius: 6px;
            border: none;
            font-weight: 600;
            cursor: pointer;
            margin-top: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            transition: background 0.2s;
        }

        .btn-primary {
            background-color: #2563eb;
            color: #ffffff;
        }

        .btn-primary:hover {
            background-color: #1d4ed8;
        }

        .btn-secondary {
            background-color: #ffffff;
            color: #1e293b;
            border: 1px solid #cbd5e1;
        }

        .btn-secondary:hover {
            background-color: #f8fafc;
        }

        .error-message {
            color: #dc2626;
            background-color: #fef2f2;
            border: 1px solid #fecaca;
            border-radius: 6px;
            padding: 10px;
            margin-top: 16px;
            font-size: 13px;
            display: none;
            text-align: left;
            word-break: break-word;
        }

        .back-link {
            display: inline-block;
            margin-top: 20px;
            color: #64748b;
            text-decoration: none;
            font-size: 14px;
        }

        .back-link:hover {
            color: #1e293b;
        }
    </style>
</head>
<body>

<div class="upload-card">
    <div class="drop-zone" id="drop-zone" onclick="document.getElementById('file-input').click()">
        <div class="file-icon">📄</div>
        <h3>Upload your resume</h3>
        <p style="color: #64748b; font-size: 13px;">Drag and drop or browse from your device</p>
        <input type="file" id="file-input" accept=".pdf,.docx" style="display: none;">
        <button type="button" class="btn btn-secondary" style="width: auto; margin: 12px auto 0;">Browse Files</button>
        <div class="file-name" id="selected-file-name"></div>
        <p style="color: #94a3b8; font-size: 12px; margin-top: 8px;">Supported formats: PDF, DOCX (Max 10MB)</p>
    </div>

    <button type="button" class="btn btn-primary" id="analyze-btn">
        ⚡ Analyze My Resume
    </button>
    
    <button type="button" class="btn btn-secondary" id="preview-btn">
        👁 Preview Uploaded File
    </button>

    <div class="error-message" id="error-box"></div>

    <a href="#" class="back-link">← Back to Dashboard</a>
</div>

<script>
    let selectedFile = null;

    const fileInput = document.getElementById('file-input');
    const fileNameDisplay = document.getElementById('selected-file-name');
    const errorBox = document.getElementById('error-box');
    const analyzeBtn = document.getElementById('analyze-btn');

    // Handle File Selection
    fileInput.addEventListener('change', (e) => {
        if (e.target.files.length > 0) {
            selectedFile = e.target.files[0];
            fileNameDisplay.textContent = selectedFile.name;
            hideError();
        }
    });

    // Handle Resume Analysis API Request
    analyzeBtn.addEventListener('click', async () => {
        if (!selectedFile) {
            showError("Please select or upload a resume file first.");
            return;
        }

        const formData = new FormData();
        formData.append("resume", selectedFile);

        hideError();
        analyzeBtn.disabled = true;
        analyzeBtn.textContent = "Analyzing...";

        try {
            // FIX: Point to the backend endpoint that handles POST requests
            const response = await fetch('/api/analyze', { 
                method: 'POST',
                body: formData
            });

            // Check if backend returned an HTML error (e.g. 405, 404, 500)
            const contentType = response.headers.get("content-type");
            
            if (!response.ok) {
                if (contentType && contentType.includes("text/html")) {
                    // Strips raw HTML tags from web server errors like 405 Not Allowed
                    throw new Error(`Server error (${response.status}): Endpoint does not support POST requests.`);
                } else {
                    const errData = await response.json();
                    throw new Error(errData.message || `Server error (${response.status})`);
                }
            }

            const data = await response.json();
            alert("Analysis successful!");
            console.log("Analysis Result:", data);

        } catch (err) {
            showError(err.message);
        } finally {
            analyzeBtn.disabled = false;
            analyzeBtn.textContent = "⚡ Analyze My Resume";
        }
    });

    function showError(msg) {
        errorBox.textContent = `❌ ${msg}`;
        errorBox.style.display = 'block';
    }

    function hideError() {
        errorBox.style.display = 'none';
    }
</script>

</body>
</html>
