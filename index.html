<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FolioPulse | Welcome</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, sans-serif;
            background-color: #0b0f19;
            color: white;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            position: relative;
            overflow-x: hidden;
        }

        /* Animated Graphic Background Elements */
        .bg-graphics {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            z-index: 0;
            pointer-events: none;
            overflow: hidden;
        }

        /* Radial Glowing Orbs */
        .orb {
            position: absolute;
            border-radius: 50%;
            filter: blur(100px);
            opacity: 0.45;
            animation: float 10s infinite alternate ease-in-out;
        }

        .orb-1 {
            width: 380px;
            height: 380px;
            background: #3b82f6;
            top: -50px;
            left: -50px;
        }

        .orb-2 {
            width: 450px;
            height: 450px;
            background: #8b5cf6;
            bottom: -100px;
            right: -100px;
            animation-delay: -5s;
        }

        /* Tech Grid Pattern Overlay */
        .grid-pattern {
            position: absolute;
            inset: 0;
            background-image: 
                linear-gradient(to right, rgba(255, 255, 255, 0.04) 1px, transparent 1px),
                linear-gradient(to bottom, rgba(255, 255, 255, 0.04) 1px, transparent 1px);
            background-size: 50px 50px;
        }

        @keyframes float {
            0% { transform: translate(0, 0) scale(1); }
            100% { transform: translate(30px, 40px) scale(1.1); }
        }

        /* Navigation Header */
        .navbar {
            position: relative;
            z-index: 10;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 20px 5%;
            background: rgba(11, 15, 25, 0.7);
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(12px);
        }

        .logo {
            font-size: 24px;
            font-weight: bold;
            text-decoration: none;
            color: white;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .nav-buttons {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        /* Separate Direct Page Navigation Buttons */
        .btn-signin {
            color: #e2e8f0;
            text-decoration: none;
            padding: 10px 20px;
            border-radius: 8px;
            font-size: 14px;
            font-weight: 600;
            border: 1px solid rgba(255, 255, 255, 0.15);
            background: rgba(255, 255, 255, 0.05);
            transition: all 0.2s ease;
        }

        .btn-signin:hover {
            background: rgba(255, 255, 255, 0.15);
            color: #ffffff;
            border-color: rgba(255, 255, 255, 0.3);
        }

        .btn-signup {
            color: #ffffff;
            text-decoration: none;
            padding: 10px 20px;
            border-radius: 8px;
            font-size: 14px;
            font-weight: 600;
            background: #3b82f6;
            box-shadow: 0 4px 14px rgba(59, 130, 246, 0.4);
            transition: all 0.2s ease;
        }

        .btn-signup:hover {
            background: #2563eb;
            transform: translateY(-1px);
        }

        /* Hero / Landing Content Container */
        .hero-container {
            position: relative;
            z-index: 10;
            flex: 1;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 80px 20px;
            text-align: center;
        }

        .badge {
            display: inline-block;
            padding: 6px 16px;
            background: rgba(56, 189, 248, 0.1);
            border: 1px solid rgba(56, 189, 248, 0.3);
            color: #38bdf8;
            border-radius: 20px;
            font-size: 13px;
            font-weight: bold;
            margin-bottom: 20px;
        }

        .hero-title {
            font-size: 48px;
            line-height: 1.2;
            margin-bottom: 18px;
            font-weight: 800;
            max-width: 750px;
        }

        .hero-title span {
            background: linear-gradient(90deg, #38bdf8, #818cf8);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .hero-subtitle {
            font-size: 18px;
            color: #94a3b8;
            margin-bottom: 40px;
            max-width: 600px;
            line-height: 1.6;
        }

        .cta-group {
            display: flex;
            gap: 16px;
            justify-content: center;
            flex-wrap: wrap;
        }

        .cta-btn {
            padding: 14px 32px;
            border-radius: 10px;
            font-size: 16px;
            font-weight: bold;
            text-decoration: none;
            transition: all 0.2s ease;
        }

        .cta-btn.primary {
            background: #3b82f6;
            color: white;
            box-shadow: 0 8px 25px rgba(59, 130, 246, 0.35);
        }

        .cta-btn.primary:hover {
            background: #2563eb;
            transform: translateY(-2px);
        }

        .cta-btn.secondary {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.15);
            color: white;
        }

        .cta-btn.secondary:hover {
            background: rgba(255, 255, 255, 0.1);
            border-color: #38bdf8;
            transform: translateY(-2px);
        }

        @media (max-width: 600px) {
            .hero-title { font-size: 32px; }
            .hero-subtitle { font-size: 15px; }
        }
    </style>
</head>
<body>

    <!-- Graphic Background Overlay -->
    <div class="bg-graphics">
        <div class="orb orb-1"></div>
        <div class="orb orb-2"></div>
        <div class="grid-pattern"></div>
    </div>

    <!-- Header Navigation Bar -->
    <nav class="navbar">
        <a href="index.html" class="logo">⚡ FolioPulse</a>

        <!-- Sign In & Create Account direct route buttons -->
        <div class="nav-buttons">
            <a href="signin.html" class="btn-signin">Sign In</a>
            <a href="signup.html" class="btn-signup">Create Account</a>
        </div>
    </nav>

    <!-- Main Landing View -->
    <main class="hero-container">
        <div class="badge">🚀 Portfolio Builder</div>
        <h1 class="hero-title">Build & Share Your <span>Professional Portfolio</span> Instantly</h1>
        <p class="hero-subtitle">Convert your resume into a personalized showcase website or start editing your details directly from your dashboard.</p>

        <div class="cta-group">
            <a href="signup.html" class="cta-btn primary">Create Account</a>
            <a href="signin.html" class="cta-btn secondary">Sign In</a>
        </div>
    </main>

</body>
</html>
