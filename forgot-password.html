<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forgot Password | FolioPulse</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #0f172a, #1e3a8a);
            color: white;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .container {
            width: 100%;
            max-width: 430px;
            padding: 20px;
        }

        .auth-card {
            background: rgba(15, 23, 42, 0.95);
            padding: 40px;
            border-radius: 18px;
            border: 1px solid rgba(255, 255, 255, 0.12);
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.35);
        }

        .logo {
            text-align: center;
            font-size: 28px;
            font-weight: bold;
            margin-bottom: 15px;
        }

        h1 {
            text-align: center;
            font-size: 25px;
            margin-bottom: 10px;
        }

        .subtitle {
            text-align: center;
            color: #94a3b8;
            margin-bottom: 30px;
            line-height: 1.5;
            font-size: 14px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            color: #cbd5e1;
            font-size: 14px;
        }

        input {
            width: 100%;
            padding: 13px;
            border: 1px solid #475569;
            border-radius: 8px;
            background: #1e293b;
            color: white;
            font-size: 15px;
            outline: none;
            transition: border-color 0.2s ease;
        }

        input:focus {
            border-color: #38bdf8;
        }

        button {
            width: 100%;
            padding: 14px;
            border: none;
            border-radius: 8px;
            background: #3b82f6;
            color: white;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: background 0.2s ease;
        }

        button:hover {
            background: #2563eb;
        }

        .success-banner {
            display: none;
            background: rgba(16, 185, 129, 0.15);
            border: 1px solid #10b981;
            color: #6ee7b7;
            padding: 15px;
            border-radius: 8px;
            text-align: center;
            font-size: 14px;
            margin-bottom: 20px;
            line-height: 1.4;
        }

        .bottom {
            text-align: center;
            margin-top: 22px;
            color: #94a3b8;
            font-size: 14px;
        }

        a {
            color: #38bdf8;
            text-decoration: none;
            font-weight: bold;
        }

        a:hover {
            text-decoration: underline;
        }

        .back-home {
            display: block;
            text-align: center;
            margin-top: 20px;
            color: #94a3b8;
            font-size: 13px;
            font-weight: normal;
            transition: color 0.2s ease;
        }

        .back-home:hover {
            color: #ffffff;
            text-decoration: none;
        }
    </style>
</head>

<body>

    <div class="container">
        <div class="auth-card">

            <div class="logo">⚡ FolioPulse</div>

            <h1>Forgot Password?</h1>

            <p class="subtitle">
                Enter your email address and we'll send you instructions to reset your password.
            </p>

            <div id="success-banner" class="success-banner">
                Password reset link has been sent to your email address!
            </div>

            <form id="reset-form" onsubmit="handleReset(event)">
                <div class="form-group">
                    <label for="email">Email Address</label>
                    <input
                        type="email"
                        id="email"
                        placeholder="Enter your email"
                        required
                    >
                </div>

                <button type="submit">
                    Send Reset Link
                </button>
            </form>

            <div class="bottom">
                Remember your password?
                <a href="signin.html">Sign In</a>

                <a href="index.html" class="back-home">← Back to Home</a>
            </div>

        </div>
    </div>

    <script>
        function handleReset(event) {
            event.preventDefault();
            const form = document.getElementById('reset-form');
            const banner = document.getElementById('success-banner');
            
            form.style.display = 'none';
            banner.style.display = 'block';
        }
    </script>

</body>
</html>
